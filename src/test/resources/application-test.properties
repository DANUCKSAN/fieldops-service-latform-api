spring.datasource.url=${FIELDOPS_TEST_DB_URL:jdbc:postgresql://localhost:5432/fieldops-test}
spring.datasource.username=${FIELDOPS_TEST_DB_USERNAME:postgres}
spring.datasource.password=${FIELDOPS_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/test-jwks
